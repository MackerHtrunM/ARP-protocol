services:
  - type: web
    name: arp-protocol-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://mackerhtrunm.github.io,http://localhost:8000,http://127.0.0.1:8000
